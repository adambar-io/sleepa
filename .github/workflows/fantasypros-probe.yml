# FantasyPros API probe: run by hand (Actions -> "FantasyPros probe" -> Run workflow). Uses the FANTASYPROS_API_KEY
# repository secret, makes at most 10 API calls (the key allows 100 a day), prints what came back and writes nothing
# to the repo. The scheduled snapshot comes later, once this shows the data is real and matches fantasypros.com.
name: FantasyPros probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python fantasypros_probe.py
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
